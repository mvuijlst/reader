# /etc/nginx/sites-available/reader-yusupov — https://reader.yusupov.cloud
# No default_server, so it sits alongside other vhosts on the same box.
# certbot --nginx -d reader.yusupov.cloud adds the 443 block + redirect.

server {
    listen 80;
    listen [::]:80;
    server_name reader.yusupov.cloud;

    client_max_body_size 10m;   # OPML imports

    location /static/ {
        alias /home/django/reader-yusupov/app/staticfiles/;
        expires 30d;            # filenames are content-hashed (ManifestStaticFilesStorage)
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:8027;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }
}
